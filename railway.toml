# One Railway service: Nixpacks installs both packages, `npm run build`
# writes frontend/dist and backend/dist, `npm start` runs the API.
# The API serves frontend/dist and falls back to index.html for client routes.

[build]
builder = "NIXPACKS"
buildCommand = "npm run build"

[deploy]
startCommand = "npm start"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

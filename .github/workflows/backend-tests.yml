name: Backend tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: koliath_install_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d koliath_install_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --prefix backend
      - run: npm test --prefix backend
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/koliath_install_test
          INSTALL_IP_HASH_SALT: ci-salt
